<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — ToonFlix Hindi Dub</title><link rel="stylesheet" href="style.css"></head>
<body class="admin-body">
<div id="login" class="auth-wrap"><div class="auth-card"><div class="brand"><span class="brand-mark">T</span><span>ToonFlix <b>Admin</b></span></div><h1>Admin login</h1><p>Firebase Authentication is required to manage the library.</p>
<input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="loginBtn" class="primary">Sign in</button><div id="loginMsg" class="status"></div><a href="index.html" class="back">← Back to site</a></div></div>
<div id="app" class="hidden"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">T</span><span>ToonFlix <b>Admin</b></span></a><button id="logout" class="ghost">Logout</button></header>
<main class="admin-main"><div class="admin-title"><div><span class="eyebrow">CONTROL CENTER</span><h1>Anime Manager</h1></div><button id="newAnime" class="primary">+ New Anime</button></div>
<div class="admin-layout"><section class="panel"><h2 id="formTitle">Add anime</h2><input id="aTitle" placeholder="Anime title *"><input id="aPoster" placeholder="Poster image URL"><div class="two"><input id="aYear" type="number" placeholder="Year"><input id="aRating" type="number" step=".1" min="0" max="10" placeholder="Rating"></div><input id="aGenre" placeholder="Genre (e.g. Action, Fantasy)"><select id="aFormat"><option>TV</option><option>MOVIE</option><option>ONA</option><option>OVA</option><option>SPECIAL</option></select><select id="aSubDub"><option>Hindi Dub</option><option>Hindi + Japanese</option><option>Sub Only</option></select><textarea id="aSynopsis" placeholder="Synopsis"></textarea>
<h3>Episodes</h3><div id="epRows"></div><button id="addEp" class="secondary">+ Add episode</button><div class="form-actions"><button id="save" class="primary">Save Anime</button><button id="cancel" class="ghost">Cancel</button></div><div id="saveMsg" class="status"></div></section>
<section class="panel"><div class="library-head"><h2>Library</h2><button id="refresh" class="secondary">Refresh</button></div><input id="filter" class="search full" placeholder="Search library..."><div id="library" class="admin-list"></div></section></div></main></div>
<script src="config.js"></script><script src="admin.js"></script></body></html>
